<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상품 촬영 시안</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d1f23;--sub:#5c6370;--line:#d9dde3;--blue:#1565c0;--ok:#2e7d32;--warn:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#202329;--ink:#eef0f3;--sub:#a4abb6;--line:#343942;--blue:#64a6ff;--ok:#6fcf74;--warn:#ff7b7b}}
:root[data-theme="dark"]{--bg:#15171a;--card:#202329;--ink:#eef0f3;--sub:#a4abb6;--line:#343942;--blue:#64a6ff;--ok:#6fcf74;--warn:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 120px}
h1{font-size:22px;margin:4px 0 12px}
.badge{display:inline-block;font-size:13px;background:#ffe9a8;color:#5a4300;border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
label.t{display:block;font-weight:700;margin:6px 0}
input[type=text]{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.prog{margin:14px 0 8px;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 4px 8px;text-align:center;cursor:pointer}
.tile.done{border-color:var(--ok)}
.tile .no{position:absolute;left:8px;top:4px;font-size:14px;font-weight:800;color:var(--sub)}
.tile .ck{position:absolute;right:8px;top:4px;color:var(--ok);font-size:22px;font-weight:800;display:none}
.tile.done .ck{display:block}
.tile svg{width:100%;max-width:96px;aspect-ratio:1;display:block;margin:2px auto 0}
.tile .nm{font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap}
.tile img.th{width:100%;aspect-ratio:1;height:auto;object-fit:contain;border-radius:8px;background:#fff}
.tile.done svg{display:none}
.tile input{display:none}
.retake{font-size:14px;color:var(--blue);margin-top:2px}
.extra{margin-top:16px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px}
.extra .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.dt{position:relative;border:2px solid var(--ok);border-radius:12px;padding:4px;text-align:center;font-size:14px;font-weight:700}
.dt img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff;display:block}
.dt .src{position:absolute;right:6px;top:6px;font-size:11px;background:var(--ok);color:#fff;border-radius:6px;padding:1px 5px}
.dt.new .src{background:var(--blue)}
.btn{display:block;width:100%;font-size:20px;font-weight:800;padding:16px;border:0;border-radius:12px;cursor:pointer}
.btn.sub{background:var(--card);color:var(--blue);border:2px solid var(--blue);margin-top:10px;font-size:18px;padding:12px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot .in{max-width:520px;margin:0 auto}
.foot .btn{background:var(--blue);color:#fff}
.foot .btn:disabled{background:var(--line);color:var(--sub)}
.msg{font-size:15px;color:var(--sub);margin-top:6px;text-align:center}
.chk{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.chk input{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:6px}
.chk .btn{background:var(--ok);color:#fff;margin-top:8px;font-size:18px;padding:12px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.cg div{border-radius:10px;padding:8px 2px;text-align:center;font-size:15px;font-weight:700;border:2px solid}
.cg .y{border-color:var(--ok);color:var(--ok)}
.cg .n{border-color:var(--warn);color:var(--warn);border-style:dashed}
.cres{font-size:15px;color:var(--sub);margin-top:8px;line-height:1.6}
.pinbox{margin-bottom:10px}
.pinbox input{width:100%;font-size:20px;padding:12px;border:2px solid var(--warn);border-radius:10px;background:var(--card);color:var(--ink)}
.cres a{color:var(--blue)}
.tile .src{position:absolute;right:6px;bottom:30px;font-size:11px;background:var(--ok);color:#fff;border-radius:6px;padding:1px 5px}
.dimg{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff;display:block;margin-bottom:4px}
.tile .no,.tile .ck{z-index:1;background:var(--card);border-radius:8px;padding:0 5px}
.nothumb{width:100%;aspect-ratio:1;border-radius:8px;box-sizing:border-box;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ok);font-weight:800;font-size:15px;border:2px dashed var(--ok)}
.nothumb small{font-size:11px;color:var(--sub);font-weight:400;word-break:break-all}
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}
#viewer[hidden]{display:none}
#viewer img{width:100%;height:100%;object-fit:contain}
#vCap{position:absolute;top:0;left:0;right:0;padding:12px 16px;color:#fff;font-size:18px;font-weight:700;background:linear-gradient(#000a,#0000);text-align:center}
#vHint{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ccc;font-size:14px}
#vRetake{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:18px;font-weight:800;padding:12px 28px;border:0;border-radius:12px;background:#fff;color:#1565c0}
.dt{cursor:pointer}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:10px 0 6px;font-size:15px}
.crumb button{border:0;background:var(--bg);color:var(--blue);font-size:15px;font-weight:700;padding:6px 8px;border-radius:8px;cursor:pointer}
.crumb button.cur{color:var(--ink);background:transparent}
.crumb i{color:var(--sub);font-style:normal}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.fd{border:0;background:var(--bg);border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:700;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.fd svg{width:52px;height:44px;display:block;margin:0 auto 4px}
.fd:active{transform:scale(.97)}
.ffilter{margin-top:6px}
.byurl{margin-top:14px}
.byurl summary{color:var(--sub);font-size:15px;cursor:pointer}
.up{margin-top:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer}
.where{font-size:15px;color:var(--sub);margin-top:6px;line-height:1.5}
.where b{color:var(--blue)}
.here{margin-top:8px;background:var(--blue);color:#fff}
.tree{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:4px 0;max-height:60vh;overflow:auto}
.tr{display:flex;align-items:center;gap:6px;padding-top:9px;padding-bottom:9px;padding-right:8px;cursor:pointer;font-size:17px;user-select:none}
.tr.sel{background:#e3eefc}
:root[data-theme="dark"] .tr.sel{background:#1f3350}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tr.sel{background:#1f3350}}
.tr .ar{display:inline-block;width:22px;text-align:center;font-size:20px;color:var(--sub);transition:transform .15s;flex:none}
.tr .ar.o{transform:rotate(90deg)}
.tr .fi{width:24px;height:20px;flex:none}
.tr .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .ld{margin-left:auto;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
 <h1>상품 촬영</h1>
 <div id="pinBox" class="pinbox" hidden><label class="t" for="pin">사용 비밀번호</label><input id="pin" type="tel" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="처음 한 번만 입력" style="letter-spacing:4px"></div>
 <label class="t" for="pname">1. 상품 이름</label>
 <input id="pname" type="text" placeholder="예: 코코체어 블랙">
 <div class="where" id="where">저장 위치: 269 촬영 원본 무보정 › (상품 이름)</div>
 <div class="prog">2. 방향별 촬영 <span id="cnt">0 / 9</span></div>
 <div class="bar"><i id="barI"></i></div>
 <div class="grid" id="grid"></div>
 <div class="extra">
  <b>3. 디테일 사진 (<span id="detN">0</span>장)</b>
  <div class="row" id="exRow"></div>
  <button class="btn sub" id="exBtn">＋ 디테일 촬영</button>
  <input id="exIn" type="file" accept="image/*" capture="environment" hidden>
 </div>
 <div class="chk">
  <b>5. 드라이브 저장 확인</b>
  <div class="cres">폴더 이름을 누르면 안쪽 폴더가 펼쳐지고, 그 폴더의 사진을 위 2번·3번 칸에 보여 줍니다. 새로 찍은 사진은 파랗게 고른 폴더 안에 상품 이름 폴더를 만들어 저장합니다.</div>
  <div id="fb" class="tree"></div>
  <div id="fOut"></div>
  <details class="byurl"><summary>폴더 주소로 확인하기</summary>
   <input id="fUrl" type="text" value="https://drive.google.com/drive/u/0/folders/1LVTdCj3k7PzJzHIDgmgN9fy4Zy9lMCnJ" placeholder="https://drive.google.com/drive/folders/...">
   <button class="btn" id="fBtn">폴더 확인하기</button>
  </details>
 </div>
</div>
<div id="viewer" hidden><img id="vImg" alt=""><div id="vCap"></div><div id="vHint">화면을 한 번 더 누르면 돌아갑니다</div><button id="vRetake">📷 다시 찍기</button></div>
<div class="foot"><div class="in">
 <button class="btn" id="save" disabled>4. 구글 드라이브에 한 번에 저장</button>
 <div class="msg" id="msg">상품 이름과 사진을 넣으면 버튼이 켜집니다.</div>
</div></div>
<script>
/* 촬영 순서와 의자 그림 각도: [이름, 좌우 회전(도), 위에서 내려다보는 각도(도)] */
const DIRS=[
 ['정면',0,8],['정면 15°',15,8],['정면 45°',45,8],['옆면',90,5],
 ['윗면',0,72],['윗면 15°',30,50],['뒷면 15°',165,8],['뒷면 45°',135,8],['뒷면',180,8]
];
/* 간단한 의자 입체 그림 (상자 여러 개를 돌려서 그림) */
const BOX=[ // [x1,x2,y1,y2,z1,z2,색]
 [-20,-16,0,42,15,19,'w'],[16,20,0,42,15,19,'w'],          // 앞다리
 [-20,-16,0,86,-20,-16,'w'],[16,20,0,86,-20,-16,'w'],       // 뒷다리(등받이 기둥)
 [-20,20,40,44,-20,19,'w'],                                  // 좌판 틀
 [-17,17,44,48,-15,18,'c'],                                  // 쿠션
 [-16,16,68,83,-20,-17,'w'],                                 // 등판
 [-16,16,55,58,-19,-17,'w'],                                 // 중간 살
 [-16,16,14,17,-19,-17,'w'],[-16,16,14,17,15,17,'w']         // 아래 가로대
];
function chairSVG(yaw,el){
 const cy=Math.cos(yaw*Math.PI/180),sy=Math.sin(yaw*Math.PI/180),ce=Math.cos(el*Math.PI/180),se=Math.sin(el*Math.PI/180);
 const P=([x,y,z])=>{const x1=x*cy-z*sy,z1=x*sy+z*cy;y-=43;return [x1,y*ce-z1*se,y*se+z1*ce];};
 const F=[];
 BOX.forEach(([a,b,c,d,e,f,k])=>{
  const v=[[a,c,e],[b,c,e],[b,d,e],[a,d,e],[a,c,f],[b,c,f],[b,d,f],[a,d,f]].map(P);
  [[4,5,6,7,[0,0,1]],[1,0,3,2,[0,0,-1]],[0,4,7,3,[-1,0,0]],[5,1,2,6,[1,0,0]],[3,7,6,2,[0,1,0]],[0,1,5,4,[0,-1,0]]].forEach(q=>{
   const n=P(q[4]),o=P([0,0,0]),nz=n[2]-o[2];if(nz<=0.01)return;
   const lit=0.55+0.45*Math.max(0,(n[1]-o[1])*0.6+nz*0.8);
   F.push({pts:q.slice(0,4).map(t=>v[t]),z:q.slice(0,4).reduce((s,t)=>s+v[t][2],0)/4,lit,k});
  });
 });
 F.sort((p,q)=>p.z-q.z);
 const all=F.flatMap(f=>f.pts),xs=all.map(p=>p[0]),ys=all.map(p=>-p[1]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),sz=Math.max(x1-x0,y1-y0)+12;
 const vb=`${((x0+x1)/2-sz/2).toFixed(1)} ${((y0+y1)/2-sz/2).toFixed(1)} ${sz.toFixed(1)} ${sz.toFixed(1)}`;
 const col=(k,l)=>{const t=Math.min(1,0.78+0.22*l);return k==='c'?`rgb(${Math.round(92*t)},${Math.round(98*t)},${Math.round(110*t)})`:`rgb(${Math.round(222*t)},${Math.round(160*t)},${Math.round(112*t)})`;};
 return `<svg viewBox="${vb}">${F.map(f=>{const c=col(f.k,f.lit);return `<polygon points="${f.pts.map(p=>p[0].toFixed(1)+','+(-p[1]).toFixed(1)).join(' ')}" fill="${c}" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/>`;}).join('')}</svg>`;
}
const shots={},extras=[];
const g=document.getElementById('grid'),TILES=[];
DIRS.forEach(([nm,yw,el],i)=>{
 const t=document.createElement('div');t.className='tile';
 t.innerHTML=`<span class="no">${i+1}</span><span class="ck">✓</span>${chairSVG(yw,el)}<div class="pic"></div><div class="nm">${nm}</div><div class="retake" hidden>눌러서 크게 보기</div><input type="file" accept="image/*" capture="environment">`;
 const inp=t.querySelector('input');
 t.addEventListener('click',e=>{if(e.target===inp)return;if(t.dataset.big)openView(t.dataset.big,t.dataset.small,nm,()=>inp.click());else inp.click();});
 inp.addEventListener('change',()=>{const f=inp.files[0];if(!f)return;
  shots[nm]=f;const u=URL.createObjectURL(f);t.dataset.big=u;t.dataset.small=u;const o0=t.querySelector('.src');if(o0)o0.remove();
  t.querySelector('.pic').innerHTML=`<img class="th" src="${u}" alt="">`;
  t.querySelector('.retake').hidden=false;t.classList.add('done');upd();});
 TILES.push(t);g.appendChild(t);
});
const exIn=document.getElementById('exIn');
document.getElementById('exBtn').onclick=()=>exIn.click();
exIn.onchange=()=>{const f=exIn.files[0];if(!f)return;extras.push(f);
 exIn.value='';drawDet();upd();};
let DRIVE_DETS=[];
/* 디테일 칸: 드라이브에 있는 디테일 + 이 폰에서 새로 찍은 디테일을 개수만큼 칸으로 */
function drawDet(){
 document.getElementById('detN').textContent=DRIVE_DETS.length+extras.length;
 const row=document.getElementById('exRow');
 row.innerHTML=DRIVE_DETS.map(d=>`<div class="dt" data-big="${d.id?`https://drive.google.com/thumbnail?id=${d.id}&sz=w2000`:(d.thumb||'')}" data-small="${d.thumb||''}" data-nm="${d.name.replace(/\.[^.]+$/,'')}">${d.thumb?`<img src="${d.thumb}" alt="">`:''}<span class="src">드라이브</span>${d.name.replace(/\.[^.]+$/,'')}</div>`).join('')
  +extras.map((f,i)=>{const u=URL.createObjectURL(f);return `<div class="dt new" data-big="${u}" data-small="${u}" data-nm="디테일${DRIVE_DETS.length+i+1}"><img src="${u}" alt=""><span class="src">새로 찍음</span>디테일${DRIVE_DETS.length+i+1}</div>`;}).join('');
}
document.getElementById('pname').addEventListener('input',upd);
function upd(withMsg=true){
 const n=Object.keys(shots).length;
 document.getElementById('cnt').textContent=n+' / '+DIRS.length;
 document.getElementById('barI').style.width=(n/DIRS.length*100)+'%';
 const name=document.getElementById('pname').value.trim();
 const ok=name&&(n+extras.length)>0;
 document.getElementById('save').disabled=!ok;
 if(withMsg)document.getElementById('msg').textContent=ok?`저장 예정: "${name}" 폴더에 ${n+extras.length}장`:'상품 이름과 사진을 넣으면 버튼이 켜집니다.';
}
/* ───── 드라이브 연결 ───── */
const API='https://script.google.com/macros/s/AKfycbw0B7IE5YgaeIwfQCaujgTesCTomZYTL1pzyICR5nSepAjvcJuTVlpVdvn6XNZfT_3B/exec';
const $=id=>document.getElementById(id);
let PIN='';try{PIN=localStorage.getItem('camPin')||'';}catch(e){}
if(!PIN)$('pinBox').hidden=false;
window.addEventListener('load',()=>{showWhere();renderTree();if(PIN)check({folderId:ROOT_ID});});
$('pin').addEventListener('input',()=>{PIN=$('pin').value.replace(/\s+/g,'');try{localStorage.setItem('camPin',PIN);}catch(e){}});
async function call(body){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pin:PIN}),redirect:'follow'});
 const j=await r.json();
 if(j.badPin){try{localStorage.removeItem('camPin');}catch(e){}PIN='';$('pin').value='';$('pinBox').hidden=false;$('pin').focus();}
 if(!j.ok)throw new Error(j.error||'오류');
 return j;
}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f);});
const extOf=f=>((f.name||'').match(/\.(jpe?g|png|heic|heif|webp)$/i)||[,'jpg'])[1].toLowerCase().replace('jpeg','jpg');
const fileName=i=>String(i+1).padStart(2,'0')+'_'+DIRS[i][0].replace('°','');
let busy=false;
/* 저장 위치: 아래 5번에서 열어 둔 폴더(CUR). 상품 이름이 그 폴더 이름과 같으면 그 폴더에 바로 저장, 다르면 그 안에 상품 폴더를 만들어 저장 */
let CUR=[{id:'',name:'269 촬영 원본 무보정'}],AUTO_NAME='';
function curFolder(){return CUR[CUR.length-1];}
function saveTarget(){const n=$('pname').value.trim(),c=curFolder();return (c.id&&CUR.length>1&&n===c.name)?{into:c.id}:{parent:c.id};}
function showWhere(){const n=$('pname').value.trim(),t=saveTarget(),names=CUR.map(p=>p.name);
 $('where').innerHTML='저장 위치: '+names.map(esc).join(' › ')+(t.into?' <b>(이 폴더에 이어서 저장)</b>':' › <b>'+(n?esc(n):'(상품 이름)')+'</b>'+(n?' <small>(없으면 새로 만듦)</small>':''));}
$('pname').addEventListener('input',()=>{AUTO_NAME='';showWhere();});
$('save').onclick=async()=>{
 if(busy)return;
 const product=$('pname').value.trim();
 if(!PIN){$('pinBox').hidden=false;$('pin').focus();$('msg').textContent='사용 비밀번호를 먼저 넣어 주세요.';return;}
 const jobs=[];
 DIRS.forEach(([nm],i)=>{if(shots[nm])jobs.push({f:shots[nm],name:fileName(i),nm});});
 extras.forEach((f,i)=>jobs.push({f,name:'디테일'+(DRIVE_DETS.length+i+1),ex:true}));
 const tg=saveTarget(),okEx=new Set();
 busy=true;$('save').disabled=true;let done=0,fail=[],folderUrl='',savedId='';
 for(const jb of jobs){
  $('msg').innerHTML=`⏳ 저장 ${done+1} / ${jobs.length} : ${jb.name}`;
  try{const r=await call({action:'upload',product,intoFolderId:tg.into||'',parentId:tg.parent||'',name:jb.name+'.'+extOf(jb.f),mime:jb.f.type||'image/jpeg',data:await b64(jb.f)});folderUrl=r.folderUrl;savedId=r.folderId;done++;if(jb.nm)delete shots[jb.nm];if(jb.ex)okEx.add(jb.f);}
  catch(e){fail.push(jb.name+' ('+e.message+')');if(/비밀번호/.test(e.message))break;}
 }
 /* 저장된 사진은 이 폰 목록에서 빼서 두 번 올라가지 않게 함 (드라이브 사진으로 다시 보임) */
 for(let k=extras.length-1;k>=0;k--)if(okEx.has(extras[k]))extras.splice(k,1);
 busy=false;upd(false);drawDet();
 $('msg').innerHTML=fail.length?`❌ ${done}장 저장, ${fail.length}장 실패<br>${fail.join('<br>')}`:`✅ ${done}장 모두 저장했습니다.`;
 if(folderUrl){$('fUrl').value=folderUrl;}
 if(done&&savedId)check({folderId:savedId});
};
/* ───── 저장 확인 ───── */
$('fBtn').onclick=()=>check();
/* ───── 폴더 나무(트리) 보기 ───── */
const ROOT_ID='1LVTdCj3k7PzJzHIDgmgN9fy4Zy9lMCnJ';
const NODES={};
function node(id,name,parent){if(!NODES[id])NODES[id]={id,name,parent,kids:null,open:false};else if(name)NODES[id].name=name;return NODES[id];}
const ROOTN=node(ROOT_ID,'269 촬영 원본 무보정',null);ROOTN.open=true;let SEL='';
const FOLDER_SM='<svg class="fi" viewBox="0 0 24 20"><path d="M1 3a2 2 0 0 1 2-2h6l2 2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#f4b740"/><path d="M1 7h22v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#ffcf5c"/></svg>';
function syncTree(r,path){
 let par=null;
 path.forEach(p=>{const n=node(p.id,p.name,par);n.open=true;if(par){if(!par.kids)par.kids=[];if(!par.kids.includes(n))par.kids.push(n);}par=n;});
 par.kids=(r.folders||[]).map(f=>node(f.id,f.name,par));par.loaded=true;par.open=true;SEL=par.id;
}
function renderTree(){
 const rows=[];
 (function walk(n,d){
  const ar=n.loaded&&!n.kids.length?'<span class="ar"></span>':`<span class="ar${n.open?' o':''}" data-ar="1">›</span>`;
  rows.push(`<div class="tr${n.id===SEL?' sel':''}" data-id="${n.id}" style="padding-left:${6+d*20}px">${ar}${FOLDER_SM}<span class="tn">${esc(n.name)}</span>${n.loading?'<span class="ld">⏳</span>':''}</div>`);
  if(n.open&&n.kids)n.kids.forEach(k=>walk(k,d+1));
 })(ROOTN,0);
 $('fb').innerHTML=rows.join('');
}
$('fb').addEventListener('click',e=>{
 const row=e.target.closest('.tr');if(!row)return;const n=NODES[row.dataset.id];
 if(e.target.dataset.ar&&n.loaded){n.open=!n.open;renderTree();return;}
 check({folderId:n.id});
});


const FOLDER_SVG='<svg viewBox="0 0 52 44"><path d="M4 8a4 4 0 0 1 4-4h12l5 5h19a4 4 0 0 1 4 4v23a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#f4b740"/><path d="M4 15h44v21a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#ffcf5c"/></svg>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function check(opt){
 const out=$('fOut'),product=$('pname').value.trim();
 let req;
 if(opt&&opt.root)req={action:'check',root:true};
 else if(opt&&opt.folderId)req={action:'check',folderId:opt.folderId};
 else{
  const v=$('fUrl').value.trim();
  const m=v.match(/folders\/([\w-]{10,})/)||v.match(/[?&]id=([\w-]{10,})/)||v.match(/^([\w-]{20,})$/);
  if(v&&!m){out.innerHTML='<div class="cres" style="color:var(--warn)">폴더 주소가 아닙니다. 드라이브에서 폴더를 열고 주소창 주소를 그대로 붙여 넣어 주세요.</div>';return;}
  if(!v&&!product){out.innerHTML='<div class="cres" style="color:var(--warn)">폴더 주소를 넣거나, 맨 위에 상품 이름을 적어 주세요.</div>';return;}
  req=m?{action:'check',folderId:m[1]}:{action:'check',product};
 }
 if(!PIN){$('pinBox').hidden=false;out.innerHTML='<div class="cres" style="color:var(--warn)">사용 비밀번호를 먼저 넣어 주세요.</div>';return;}
 out.innerHTML='<div class="cres">⏳ 드라이브를 확인하고 있습니다…</div>';if(req.folderId&&NODES[req.folderId]){NODES[req.folderId].loading=true;renderTree();}
 try{
  const r=await call(req);
  if(!r.found){out.innerHTML=`<div class="cres" style="color:var(--warn)">"${esc(product)}" 폴더가 아직 없습니다.</div>`;return;}
  /* 폴더 길(경로)과 안쪽 폴더 아이콘 */
  const path=r.path||[{id:r.folderId,name:r.folderName}];
  CUR=path.map((p,k)=>({id:k===0?'':p.id,name:p.name}));if(CUR.length===1&&r.folderId)CUR[0].id='';
  /* 사진이 들어 있는 폴더 = 상품 폴더 → 상품 이름 칸에 폴더 이름을 넣어 이어서 촬영 */
  const isProduct=(r.files||[]).some(f=>/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));
  const pn=$('pname').value.trim();
  if(isProduct&&path.length>1&&(!pn||pn===AUTO_NAME)){$('pname').value=path[path.length-1].name;AUTO_NAME=$('pname').value;}
  else if(!isProduct&&pn&&pn===AUTO_NAME){$('pname').value='';AUTO_NAME='';}
  showWhere();upd(false);
  const subs=r.folders||[];
  if(r.folders)syncTree(r,path);
  const IMG=/\.(jpe?g|png|heic|heif|webp|gif)$/i;
  if(!r.folders){
   out.innerHTML='<div class="cres" style="color:var(--warn)">⚠ 앱스크립트가 예전 버전이라 안쪽 폴더를 보여 줄 수 없습니다. 최신 상품촬영_Code.gs를 붙여 넣고 "배포 관리 → 연필 → 새 버전 → 배포"를 해 주세요.</div>';
   return;
  }
  if(!r.files.some(f=>IMG.test(f.name))){
   out.innerHTML=`<div class="cres">${subs.length?'이 폴더에는 사진이 없습니다. 위 목록에서 안쪽 폴더를 눌러 주세요.':'빈 폴더입니다.'}</div>`;
   return;
  }
  const names=r.files.map(f=>f.name),used=new Set();
  /* 이름 비교: 확장자·앞 번호(01_)·뒤 중복번호(_2)·띄어쓰기·°·특수문자를 빼고 비교 */
  const key=n=>String(n).normalize('NFC').replace(/\.[^.]+$/,'').replace(/^\d{1,3}[_\-. ]+/,'').replace(/_[2-9]$/,'').replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();
  const hit=DIRS.map(([nm])=>{const k=key(nm);const ms=names.filter(n=>key(n)===k);ms.forEach(n=>used.add(n));return ms.length;});
  /* 확인된 사진을 위 방향 버튼에 그림으로 보여 주기 (그 폰에서 새로 찍은 사진이 있으면 그 사진 우선) */
  const fileBy={};r.files.forEach(f=>fileBy[f.name]=f);
  const thumbOf=f=>f.thumb||(f.id?`https://drive.google.com/thumbnail?id=${f.id}&sz=w400`:'');
  DIRS.forEach(([nm],i)=>{const t=TILES[i];if(shots[nm])return;
   const k=key(nm),ms=names.filter(n=>key(n)===k).map(n=>fileBy[n]);
   const f=ms.slice().reverse().find(f=>thumbOf(f))||ms[ms.length-1];
   const pic=t.querySelector('.pic');pic.innerHTML='';const old=t.querySelector('.src');if(old)old.remove();
   if(!f){t.classList.remove('done');delete t.dataset.big;t.querySelector('.retake').hidden=true;return;}
   t.dataset.big=f.id?`https://drive.google.com/thumbnail?id=${f.id}&sz=w2000`:(f.thumb||'');t.dataset.small=f.thumb||'';t.querySelector('.retake').hidden=!t.dataset.big;
   t.classList.add('done');
   const u=thumbOf(f);
   pic.innerHTML=u?`<img class="th" src="${u}" alt="" onerror="this.outerHTML='<div class=&quot;th nothumb&quot;>사진 있음<br><small>${f.name}</small></div>'">`:`<div class="th nothumb">사진 있음<br><small>${f.name}</small></div>`;
   t.insertAdjacentHTML('beforeend','<span class="src">드라이브</span>');});
  if(!r.version)out.dataset.old='1';
  const dets=names.filter(n=>!used.has(n)&&key(n).startsWith('디테일'));dets.forEach(n=>used.add(n));
  DRIVE_DETS=dets.map(d=>{const f=fileBy[d];return {...f,thumb:thumbOf(f)};});drawDet();
  const miss=DIRS.filter((_,i)=>!hit[i]).map(d=>d[0]),other=names.filter(n=>!used.has(n));
  let res;
  res=`<div class="cres">폴더: <a href="${r.folderUrl}" target="_blank" rel="noopener">${r.folderName}</a> · 파일 ${names.length}개</div>
  <div class="cg">${DIRS.map(([nm],i)=>`<div class="${hit[i]?'y':'n'}">${hit[i]?'✓':'✗'} ${nm}${hit[i]>1?` (${hit[i]})`:''}</div>`).join('')}</div>
  ${r.version?'':'<div class="cres" style="color:var(--warn)">⚠ 앱스크립트가 예전 버전이라 사진을 받아오지 못했습니다. 새 코드를 붙여 넣고 "새 버전"으로 배포해 주세요.</div>'}
  <div class="cres">9방향 중 <b>${9-miss.length}장 있음</b>${miss.length?` · <b style="color:var(--warn)">빠진 사진: ${miss.join(', ')}</b>`:''}</div>
  <div class="cres" style="margin-top:10px"><b>디테일 ${dets.length}장</b></div>${dets.length?`<div class="cg">${dets.map(d=>`<div class="y">✓ ${d.replace(/\.[^.]+$/,'')}</div>`).join('')}</div>`:''}<div class="cres">${other.length?`그 밖의 파일 ${other.length}개: ${other.join(', ')}`:''}</div>`;
  out.innerHTML=res;
  $('fUrl').value=r.folderUrl||'';

 }catch(e){out.innerHTML=`<div class="cres" style="color:var(--warn)">❌ ${e.message}</div>`;}
 finally{Object.values(NODES).forEach(n=>n.loading=false);renderTree();}
}
/* ───── 크게 보기 ───── */
let RETAKE=null;
function openView(big,small,cap,retake){
 const v=$('viewer'),im=$('vImg');im.onerror=()=>{if(small&&im.src!==small)im.src=small;};im.src=big;
 $('vCap').textContent=cap;RETAKE=retake||null;$('vRetake').hidden=!retake;v.hidden=false;
 try{history.pushState({v:1},'');}catch(e){}
}
function closeView(fromPop){if($('viewer').hidden)return;$('viewer').hidden=true;$('vImg').src='';if(!fromPop){try{history.back();}catch(e){}}}
$('viewer').addEventListener('click',e=>{if(e.target.id==='vRetake')return;closeView();});
$('vRetake').addEventListener('click',e=>{e.stopPropagation();const r=RETAKE;closeView();if(r)setTimeout(r,50);});
window.addEventListener('popstate',()=>closeView(true));
$('exRow').addEventListener('click',e=>{const d=e.target.closest('.dt');if(d&&d.dataset.big)openView(d.dataset.big,d.dataset.small,d.dataset.nm);});
</script>
